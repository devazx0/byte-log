name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Formatting Check
        run: cargo fmt -- --check

      - name: Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Test Suite
        run: cargo test --all-targets

      - name: Telemetry SDK Ban Check
        shell: bash
        run: |
          if grep -E "(sentry|posthog|segment|analytics)" Cargo.lock; then
            echo "ERROR: Telemetry SDK detected in Cargo.lock! PCStats strictly forbids telemetry."
            exit 1
          fi
          echo "Telemetry ban verified: zero tracking SDKs present."
